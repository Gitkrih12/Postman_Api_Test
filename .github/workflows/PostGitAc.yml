name: Automated API tests using Postman CLI

on: 
  workflow_dispatch:
  push:
#  schedule:
 #   - cron: '*/30 * * * *'  # Runs every 30 minutes

permissions:
  contents: read
  checks: write  # Required for test-reporter to publish test results

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Run API tests and generate reports
        run: |
          mkdir -p report
          postman collection run "39923645-324519ea-8300-416a-b18b-9d0461012063" \
            --reporters cli,junit,html \
            --reporter-junit-export="report/report.xml" \
            --reporter-html-export="report/report.html"

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-html-report
          path: report/report.html

      - name: Upload JUnit report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: postman-junit-report
          path: report/report.xml

      - name: Publish JUnit report to GitHub Test Summary
        uses: dorny/test-reporter@v1
        with:
          name: Postman API Test Report
          path: report/report.xml
          reporter: java-junit
      - name: Email Postman Test Summary
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Postman API Test Report - ${{ env.ENV }} - ${{ github.run_number }}
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: ${{ secrets.EMAIL_FROM || secrets.EMAIL_USERNAME }}
          secure: true
          html_body: |
            <p>Hi Team,</p>
            <p>The latest <strong>Postman API test run</strong> has completed for the <strong>${{ env.ENV }}</strong> environment.</p>
            <p>Click below to download the HTML report:</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Report in GitHub</a></p>
            <p>Regards,<br>Automation Team</p>


      - name: Logout from Postman CLI
        run: postman logout
